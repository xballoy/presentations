name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install

      - name: Build presentations
        env:
          BASE: /${{ github.event.repository.name }}
        run: |
          pnpm --filter ai-tech-debt     exec slidev build slides-en.md --without-notes --base "$BASE/ai-tech-debt/en/"     --out ../dist/ai-tech-debt/en
          pnpm --filter ai-tech-debt     exec slidev build slides-fr.md --without-notes --base "$BASE/ai-tech-debt/fr/"     --out ../dist/ai-tech-debt/fr
          pnpm --filter ai-for-beginners exec slidev build slides-en.md --without-notes --base "$BASE/ai-for-beginners/en/" --out ../dist/ai-for-beginners/en
          pnpm --filter ai-for-beginners exec slidev build slides-fr.md --without-notes --base "$BASE/ai-for-beginners/fr/" --out ../dist/ai-for-beginners/fr
          pnpm --filter solid           exec slidev build slides-en.md --without-notes --base "$BASE/solid/en/"            --out ../dist/solid/en
          pnpm --filter solid           exec slidev build slides-fr.md --without-notes --base "$BASE/solid/fr/"            --out ../dist/solid/fr
          pnpm --filter opaque-types    exec slidev build slides-en.md --without-notes --base "$BASE/opaque-types/en/"     --out ../dist/opaque-types/en
          pnpm --filter opaque-types    exec slidev build slides-fr.md --without-notes --base "$BASE/opaque-types/fr/"     --out ../dist/opaque-types/fr
          cp index.html dist/index.html
          cp shared/redirect.html dist/ai-tech-debt/index.html
          cp shared/redirect.html dist/ai-for-beginners/index.html
          cp shared/redirect.html dist/solid/index.html
          cp shared/redirect.html dist/opaque-types/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-26.04
    name: Deploy
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
